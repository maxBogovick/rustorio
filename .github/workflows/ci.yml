# Непрерывная интеграция: на каждый push/PR собираем проект и гоняем все тесты.
#
# До 01.08.2026 здесь стоял workflow от Rust-версии проекта (cargo fmt/clippy/test).
# Java-сборка не запускалась в CI ни разу, а сам cargo падал на `no targets specified
# in the manifest` — файлов .rs в репозитории нет.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK ставим явно, хотя toolchain в build.gradle умеет докачать его сам:
      # так сборка не тратит время на скачивание JDK на каждом прогоне.
      - name: Установить JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Кэш зависимостей и Gradle-артефактов между прогонами.
      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      # Главный гейт: компиляция + NullAway + все тесты + jacoco. Отдельно перечислять
      # `compileToolsJava`/`compileEditorJava` не нужно — от них зависит `check` (build.gradle).
      - name: Сборка и тесты
        run: ./gradlew build --console=plain

      # Отчёты тестов и покрытия — чтобы разбирать падение, не воспроизводя его локально.
      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco
          if-no-files-found: ignore
