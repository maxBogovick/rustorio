[package]
name = "rustorio"
version = "0.1.0"
edition = "2021"
description = "Крошечная, но расширяемая мини-Factorio на Rust (учебный проект)"
license = "MIT"
authors = ["maxim"]
readme = "README.md"
keywords = ["game", "factory", "automation", "macroquad", "gamedev"]
categories = ["games"]

# Одна-единственная зависимость: macroquad — простой 2D-движок.
# Он даёт окно, отрисовку и ввод. Всю игровую логику мы пишем сами —
# так ты реально учишь Rust, а не чужие абстракции.
[dependencies]
macroquad = "0.4"

# Релизная сборка быстрее, но для учёбы хватит `cargo run`.
[profile.release]
opt-level = 3
