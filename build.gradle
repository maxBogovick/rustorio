// действительно попадал на classpath) ничего не меняет — версию байт-кода PIT проверяет сам.
//
// Что делать, когда понадобится: следить за релизами PIT на предмет поддержки major 69. Второй
// путь — собирать `src/main` с `options.release = 24` ради инструмента — сознательно отвергнут:
// это меняет то, что уезжает игроку, ради dev-проверки.
