plugins {
    id 'application'
    // maven-publish (a core Gradle plugin, not a new dependency): publishes the API a third-party
    // mod compiles against into the local Maven repository, so an EXTERNAL mod project can declare
    // `com.rustorio:rustorio-api` and needs nothing from this repository but that one coordinate.
    // Without it the only way to build a mod was to clone the whole engine and compile inside it.
    id 'maven-publish'
    id 'jacoco' // покрытие тестами (встроенный плагин Gradle)
    // Error Prone + NullAway: @NullMarked/@Nullable (JSpecify) были задекларированы во всех
    // package-info.java, но до этого их никто не проверял — IDE могла подсветить нарушение,
    // а ./gradlew build проходил всё равно. Этот плагин делает null-контракт частью компиляции.
    id 'net.ltgt.errorprone' version '4.1.0'
}

group = 'com.rustorio'
version = '0.1.0'

// Java 25 LTS (сентябрь 2025, поддержка до 2033) — новейшая LTS. Toolchain
// фиксирует версию: сборка одинакова у всех, а нужный JDK при отсутствии
// скачивается автоматически (см. foojay-плагин в settings.gradle).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// P4-11 (BUG_FIX_PROGRESS.md): `com.rustorio.Main` (headless console demo) and `com.rustorio.Benchmark`
// (dev-only perf measurement) don't belong in the production jar `application`/`run` ships — they
// used to live in `src/main` only because that's where `World`'s package-private members were
// reachable from, a justification that stopped being true once `Benchmark` moved to calling
// `World`'s public API. This source set keeps them out of `src/main` while still compiling against
// it (domain classes, and whatever those domain classes themselves depend on).
sourceSets {
    tools {
        java.srcDirs = ['src/tools/java']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Local content-editor web server (com.rustorio.editor) — dev tooling, same reasoning as
    // `tools` above: not part of the jar the player runs, just built against it.
    editor {
        java.srcDirs = ['src/editor/java']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Every directory under `src/mods` IS a mod — discovered by scanning, never named here. That is the
// same rule the engine itself follows at runtime (`ModDirectories.discover` scans `resources/mods`),
// and it has to hold in the build too: a build that names one mod is a build that has to be edited
// to add a second, which is exactly the coupling this whole split exists to remove.
//
// A mod compiles against `main` and NOT the other way round. Nothing in `sourceSets.main` may
// reference a mod — `PackageBoundaryRulesTest.theEngineDoesNotDependOnAnyMod` checks it, and this
// split makes it impossible to compile in the first place. That matters because the coupling it
// prevents is exactly what happened before: three archetypes inside `com.rustorio.domain.building`,
// three methods on `TickContext`, a branch in the renderer — none of it noticed, because sharing a
// source set is what made it invisible.
//
// NOTE: mods that live in this repository are the exception, not the model. A third-party mod is
// built in its OWN project (see `examples/external-mod-template`) and needs no entry here at all —
// it is a folder dropped into `resources/mods`, the same as in Factorio, Fabric or RimWorld.
ext.modIds = ((file('src/mods').listFiles() ?: new File[0]) as List)
        .findAll { it.directory }
        .collect { it.name }
        .sort() // deterministic task order — a build whose task graph depends on filesystem order is a build that differs between machines

// A mod's OWN third-party libraries — declared per mod and packed into that mod's jar (see the
// `<modId>ModJar` tasks below), never added to the game's classpath.
//
// This is not a style choice, it is what `ModClassLoader` requires. That loader delegates to the
// parent only for `com.rustorio.api`, `com.rustorio.domain` and the JDK; every other name must be
// found INSIDE the mod's own jar. A mod compiling against a library the engine happens to ship is
// therefore green at build time and dead the moment the game loads it — which is exactly what had
// already happened: `com.webminer.JsonFieldExtractor` imports Jackson, compiled fine, and threw
// `NoClassDefFoundError: com/fasterxml/jackson/databind/ObjectMapper` when loaded from the jar.
// `ModJarLibrariesTest` is the test that now fails if a mod's library goes missing from its jar.
configurations {
    modIds.each { modId ->
        create("${modId}ModLibraries")
        // NOTE: `<modId>ModCompileOnly` is NOT created here — the java plugin already makes one per
        // source set and puts it on that source set's compile classpath. It is where a mod's
        // annotation-only dependencies go (JSpecify): CLASS-retention markers the running game never
        // looks up, so packing them into the mod's jar the way `ModLibraries` does would ship a copy
        // of a public library for nothing. Same split the external mod template makes with
        // `compileOnly 'org.jspecify:jspecify'`.
        //
        // A mod's own tests live in src/test and run on the app classpath, so they need that mod's
        // libraries as well — otherwise a test of a class that uses jsoup cannot even compile.
        testImplementation.extendsFrom(getByName("${modId}ModLibraries"))
    }
}

// A mod compiles against the PUBLISHED API jar and its own libraries — not against the engine's
// full output. That asymmetry with `runtimeClasspath` (which does get the whole engine, because at
// run time the mod really is loaded into the running game) is the entire point: it makes the engine
// internals a mod may not touch impossible to NAME, so `ModLoader` or a renderer type is a compile
// error on the line that types it, not a ClassNotFoundException at a player's machine.
//
// `ModBoundaryRulesTest` checks the same boundary a second time, against the mods' bytecode. That is
// not redundancy: what this line guarantees, it guarantees only for as long as it says so, and no
// test reads a build script. Widening it back to `sourceSets.main.output` — which is how it read
// before, so the change looks like a restoration — would silently hand every mod the whole engine
// again, and nothing else in the gate would notice.
//
// The apiJar dependency is added AFTER the loop, where that task exists — see below.
modIds.each { modId ->
    sourceSets.create("${modId}Mod") {
        java.srcDirs = ["src/mods/$modId/java"]
        resources.srcDirs = ["src/mods/$modId/resources"]
        // Operators stay at the END of each line: Groovy would otherwise read the next line's
        // leading `+` as a unary plus and fail with "Could not find method positive()".
        // The source set's own default compile classpath is kept (`+=`, not `=`): that is what
        // carries `<modId>ModCompileOnly`, where the mod's annotation-only dependencies live.
        compileClasspath += configurations."${modId}ModLibraries"
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath +
                configurations."${modId}ModLibraries"
    }
}

// Исходники в UTF-8 (комментарии/строки на кириллице). Без явной кодировки javac берёт
// платформенную — на части машин это не UTF-8, и кириллица валит сборку «illegal character».
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Версии зависимостей — сверху, чтобы «крутить» их в одном месте.
ext {
    gdxVersion = '1.14.2'   // последняя стабильная libGDX (май 2026)
    lwjglVersion = '3.3.6'  // libGDX 1.14.2 тянет 3.3.3 (старше Java 25); см. ниже
    junitVersion = '5.11.3'
    jspecifyVersion = '1.0.0'
    jacksonVersion = '2.18.2' // сериализация сохранений в JSON (слой persist)
    errorproneVersion = '2.36.0'
    nullawayVersion = '0.12.3'
    archunitVersion = '1.4.2' // E0-03, ENGINE_TASKS.md: границы пакетов по байткоду, не по grep (владелец, 29.07.2026)
    // jsoup: разбор HTML в моде webminer (монитор показывает страницу, а не её <head>). Разрешён
    // владельцем 08.08.2026. Зависимость МОДА, а не движка: в classpath игры её нет, она уезжает
    // внутрь webminer.jar — см. конфигурацию `<modId>ModLibraries` ниже.
    jsoupVersion = '1.18.3'
}

// libGDX 1.14.2 по умолчанию подтягивает LWJGL 3.3.3, который старше Java 25 и на
// запуске ругается «Unsupported JNI version… may crash». Поднимаем весь набор
// LWJGL (включая natives-классификаторы) до 3.3.6 — та же ветка API 3.3, что ждёт
// libGDX, но с поддержкой актуальных JDK. На 3.4.x не идём: там переход на FFM,
// который может разойтись с API бэкенда libGDX.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion(lwjglVersion)
            details.because('поддержка Java 25; по умолчанию libGDX тянет LWJGL 3.3.3')
        }
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    // Нативные библиотеки движка для десктопа (OpenGL/окно/ввод).
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    // ANGLE (GLES→Metal): системный OpenGL macOS на Apple Silicon падает с SIGSEGV в
    // gleRunVertexSubmitImmediate на immediate-mode пути libGDX; ANGLE уводит рендер на Metal и
    // обходит этот драйвер. Включается в Main через setOpenGLEmulation(ANGLE_GLES20, ...) — без
    // этой зависимости вызов бросит на старте, поэтому одно без другого не имеет смысла.
    runtimeOnly "com.badlogicgames.gdx:gdx-lwjgl3-angle:$gdxVersion"

    // JSpecify: стандартные аннотации null-безопасности (@Nullable/@NullMarked).
    // Проверяются IDE и статическими анализаторами — контракт «может быть null»
    // становится машинно-проверяемым, а не «на словах».
    implementation "org.jspecify:jspecify:$jspecifyVersion"

    // Jackson: снимок игры (сохранение/загрузка) в человекочитаемый JSON. Живёт ТОЛЬКО
    // в слое persist; домен (core/model/sim/game) про JSON не знает — граница DTO.
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.tngtech.archunit:archunit-junit5:$archunitVersion"

    // An in-repo mod's own unit tests live in src/test and need that mod's classes. Tests are
    // exempt from the engine/mod boundary ArchUnit enforces (it scans src/main only) — a mod's
    // tests reaching into the mod is the ordinary thing, and it is how that mod's author runs them.
    //
    // `.classesDirs`, NOT `.output`: the latter also carries a mod's own
    // `META-INF/services/com.rustorio.api.mod.RustorioMod`, and putting THAT on the test classpath
    // makes every `ServiceLoader.load(RustorioMod)` anywhere in the suite discover that mod — which
    // broke twenty unrelated mod-loader tests with `Provider com.webminer.WebMinerMod not found`,
    // because the service file was visible where the class was not. A mod's registration must only
    // ever be found inside that mod's jar.
    modIds.each { modId -> testImplementation sourceSets."${modId}Mod".output.classesDirs }

    // What the webminer mod itself needs, and what therefore travels inside webminer.jar.
    // Jackson is listed even though the engine already has it: see the `ModLibraries` comment
    // above for why "the engine has it" is not the same as "the mod can load it".
    webminerModLibraries "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    webminerModLibraries "org.jsoup:jsoup:$jsoupVersion"

    // Annotations only — see the `ModCompileOnly` configuration above for why these are not packed
    // into webminer.jar. The mod used to get JSpecify for free off the engine's own compile
    // classpath; it no longer has that classpath, and declaring its own is what a third-party mod
    // does anyway.
    webminerModCompileOnly "org.jspecify:jspecify:$jspecifyVersion"

    errorprone "com.google.errorprone:error_prone_core:$errorproneVersion"
    errorprone "com.uber.nullaway:nullaway:$nullawayVersion"
}

// NullAway включён только на compileJava (основной код, весь размечен @NullMarked) — тестовый
// код (compileTestJava) сознательно не проверяется: JUnit-ассерты и тестовые фикстуры не несут
// того же контракта, а гонять NullAway на них — не то, о чём просил этот проект.
tasks.named('compileJava', JavaCompile).configure {
    options.errorprone {
        disableAllChecks = true // весь остальной каталог проверок Error Prone — шум, не наша цель
        error('NullAway')
        option('NullAway:AnnotatedPackages', 'com.rustorio,com.graphics')
    }
}

tasks.named('compileTestJava', JavaCompile).configure {
    options.errorprone.enabled = false
}

// src/tools (P4-11, BUG_FIX_PROGRESS.md) isn't covered by AnnotatedPackages above either — same
// reasoning as compileTestJava: NullAway is a contract for the shipped code, not for dev tooling.
tasks.named('compileToolsJava', JavaCompile).configure {
    options.errorprone.enabled = false
}

// src/editor (local content-editor web server) — same reasoning as compileToolsJava above.
tasks.named('compileEditorJava', JavaCompile).configure {
    options.errorprone.enabled = false
}

// Mods are deliberately outside NullAway's `AnnotatedPackages` (com.rustorio, com.graphics). Not an
// oversight: a third-party mod is compiled by whoever wrote it, under whatever checks they chose,
// and an in-repo mod is here to demonstrate exactly that path. The engine's null contract stops at
// the engine's own edge; what a mod does inside its jar is the mod's business, and enforcing it
// here would be testing a setup no real mod has.
modIds.each { modId ->
    tasks.named("compile${modId.capitalize()}ModJava", JavaCompile).configure {
        options.errorprone.enabled = false
    }
}

// One packaging task per in-repo mod, generated from the same scan. Each produces `<modId>.jar`
// beside that mod's own `mod.json` — `ModLoader` looks for exactly `<modId>.jar` in the mod's
// directory (see `ModJarLoader`), so neither the name nor the location is a choice here.
//
// These jars are build outputs that happen to live under `resources/` (which is where mods live),
// so they are git-ignored rather than checked in — see `.gitignore`.
modIds.each { modId ->
    tasks.register("${modId}ModJar", Jar) {
        group = 'build'
        description = "Package the $modId mod into resources/mods/$modId/${modId}.jar"
        archiveFileName = "${modId}.jar"
        destinationDirectory = layout.projectDirectory.dir("resources/mods/$modId")
        from sourceSets."${modId}Mod".output
        // The mod's own libraries, unpacked into the jar beside its classes: `ModClassLoader` looks
        // for a non-engine class in this jar and nowhere else, so a library that is merely on the
        // build classpath is a NoClassDefFoundError waiting for the first player. Signature files
        // from the libraries' own jars are dropped — they describe those jars, not this one, and a
        // JVM that checks them against repacked content rejects the lot.
        from({
            configurations."${modId}ModLibraries".collect { it.directory ? it : zipTree(it) }
        }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE // two libraries may ship the same module-info/LICENSE
    }
}

// What a mod compiles against: exactly the packages `ModClassLoader` will delegate to the parent at
// runtime, and nothing else. `com.graphics` is excluded because the dependency runs one way
// (graphics -> game) and a mod has no business naming a renderer type.
//
// These two patterns are NOT an independent decision — `ModClassLoader.PARENT_DELEGATED_PREFIXES`
// is the authority, and `ModApiSurfaceTest` opens the jar this task builds and fails if it carries
// a package that loader would refuse. That test exists because the two had already drifted: this
// task used to say `include 'com/rustorio/**'`, which shipped `persistence`, `mod` and `game` in
// full — three packages a mod could compile against and then fail to load in a player's game.
// Widening the pattern below without widening the loader turns a build error back into a
// ClassNotFoundException after shipping, which is the one failure mode a published API surface
// exists to prevent.
//
// `com.rustorio.domain` is here, not just `com.rustorio.api`, for the reason `api/mod/package-info`
// states: ItemType/BuildingPrototype/Recipe physically live in the domain today, and a mod cannot
// register content without naming those types.
//
// No dependencies are declared in the published POM on purpose. A mod that needs JSpecify
// annotations or Jackson declares them itself, at whatever version it wants, the same way a Fabric
// or RimWorld mod pulls its own libraries — this jar is an API surface, not a dependency manager.
tasks.register('apiJar', Jar) {
    group = 'publishing'
    description = 'The engine API a third-party mod compiles against (com.rustorio.api + domain)'
    archiveBaseName = 'rustorio-api'
    from(sourceSets.main.output) {
        include 'com/rustorio/api/**'
        include 'com/rustorio/domain/**'
    }
}

// The other half of the mod compile classpath (see the source-set block far above). Here rather
// than there because `files(taskProvider)` needs the task to exist, and it carries the task
// dependency with it — `compileWebminerModJava` now waits for `apiJar` without anyone saying so.
//
// Deliberately the JAR, not a filtered view of `sourceSets.main.output`: javac takes a classpath
// entry as a whole directory, so filtering a classes directory does not hide anything from it. The
// jar is also literally what an external mod resolves from `mavenLocal()`, which makes the in-repo
// mods compile against the same artifact a stranger's build would — the point of the exercise.
modIds.each { modId ->
    sourceSets."${modId}Mod".compileClasspath += files(tasks.named('apiJar'))
}

publishing {
    publications {
        api(MavenPublication) {
            groupId = 'com.rustorio'
            artifactId = 'rustorio-api'
            version = project.version
            artifact tasks.named('apiJar')
        }
    }
}

application {
    // `./gradlew run` открывает окно графики (движок libGDX).
    mainClass = 'com.graphics.Main'
}

// `./gradlew game` запускает безголовую логику игры в консоли (та, что строим с нуля в уроках).
// Отдельная задача, чтобы не смешивать с оконным `run`. `com.rustorio.Main` живёт в src/tools
// (см. sourceSets.tools выше) — это dev-демонстрация, не часть игры, что ставится игроку.
tasks.register('game', JavaExec) {
    group = 'application'
    description = 'Run the headless game logic in the console'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.rustorio.Main'
}

// Ассеты (спрайты) лежат в resources/. Запускаем из корня проекта, чтобы
// Gdx.files.internal("resources/...") их находил.
tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    // Java 25 предупреждает про «restricted method» при загрузке нативных
    // библиотек движка. Явно разрешаем native access (в будущих версиях без
    // этого флага вызовы начнут блокироваться).
    jvmArgs('--enable-native-access=ALL-UNNAMED')
    // На macOS бэкенд LWJGL3/GLFW обязан работать на главном потоке.
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs('-XstartOnFirstThread')
    }
}

// `./gradlew devRun` — то же окно, что и `run`, но с уже построенным dev-стендом
// (com.graphics.screen.DevScene): по одному живому примеру каждого здания плюс одно намеренно
// сломанное, чтобы не пересобирать один и тот же тестовый стенд руками при каждой проверке
// механики. Отдельная задача, а не аргумент к `run`, чтобы не забывать флаг каждый раз.
tasks.register('devRun', JavaExec) {
    group = 'application'
    description = 'Launch the game with the dev-mode showcase factory already built (--dev)'
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.graphics.Main'
    args('--dev')
    jvmArgs('--enable-native-access=ALL-UNNAMED')
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs('-XstartOnFirstThread')
    }
}

// `./gradlew editor` — локальный веб-редактор контента (items/recipes/buildings/textures из
// resources/mods/rustorio) с кнопкой «Играть», которая пересобирает JSON и перезапускает
// `./gradlew run` отдельным процессом. Свой sourceSet (см. sourceSets.editor выше), потому что
// это dev-инструмент разработчика мода, а не часть того, что ставится игроку.
tasks.register('editor', JavaExec) {
    group = 'application'
    description = 'Run the local content-editor web server (create/edit mod JSON content, then Play to try it in the game)'
    workingDir = rootProject.projectDir
    classpath = sourceSets.editor.runtimeClasspath
    mainClass = 'com.rustorio.editor.EditorMain'
}

// `./gradlew benchmark` — headless-замер мс/тик на большой сцене, без окна графики. `com.rustorio.Benchmark`
// живёт в src/tools (см. sourceSets.tools выше) — это dev-инструмент измерения, а не часть игры;
// он давно уже вызывает только публичный API `World` (peek, tick, place*), в package-private
// доступе не нуждается — правь его как обычный внешний код, не как часть домена.
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Headless-замер: сколько мс занимает один World.tick() на большой сцене'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.rustorio.Benchmark'
}

// `build` собирает и проверяет только main+test: задачи `tools`/`editor` в его граф не входят,
// потому что их sourceSet'ы не участвуют в `assemble` (в jar они не попадают) и в `check`
// (тестов у них нет). До этой строки главный гейт проекта пропускал поломку в `com.rustorio.Main`,
// `Benchmark` и веб-редакторе целиком: `./gradlew build` оставался зелёным, а `./gradlew game`,
// `benchmark` и `editor` падали при запуске. Оба dev-sourceSet'а компилируются против `src/main`,
// поэтому ломает их обычно правка домена — то есть ровно то, что `build` и должен ловить.
tasks.named('check') {
    dependsOn tasks.named('compileToolsJava'), tasks.named('compileEditorJava')
    dependsOn modIds.collect { tasks.named("compile${it.capitalize()}ModJava") }
}

// Every entry point that loads mods needs the mod's jar to already exist on disk: a `mod.json`
// declaring an `entryPoint` whose jar is missing is a hard ModLoadException, not a skipped mod
// (see `ModJarLoader`). That covers every way this project starts — the window, the headless demo,
// the benchmark, the content editor — and the tests, which read `resources/mods` straight off disk.
// Registered here, at the end, because `tasks.named` needs these tasks to exist already.
def modJarTasks = modIds.collect { tasks.named("${it}ModJar") }
['run', 'test', 'devRun', 'game', 'benchmark', 'editor'].each { name ->
    tasks.named(name) { dependsOn modJarTasks }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')

    // Тесты читают `resources/mods` НАПРЯМУЮ с диска (VanillaAsModParityTest, VoronBananaAcceptanceTest,
    // ModDirectories/ModLoader-тесты) — это рабочий каталог, а не classpath: `processResources`
    // здесь NO-SOURCE, потому что `src/main/resources` не существует. Gradle про такое чтение не
    // знает, поэтому без этой строки правка контента мода не делала задачу устаревшей: можно было
    // добавить предмет в ванильный мод, получить `> Task :test UP-TO-DATE` и BUILD SUCCESSFUL,
    // хотя `VanillaAsModParityTest` на этом контенте падает. Проверено 01.08.2026.
    // Каталог, а не весь `resources/`: спрайты в корне и фронтенд редактора тесты не читают,
    // и перезапускать из-за них весь набор незачем.
    inputs.dir('resources/mods')
            .withPropertyName('modContent')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // То же самое и по той же причине для `examples/`: пример мода переехал туда из тестовых
    // ресурсов (его читает PhaseSevenAcceptanceTest), и без этой строки правка примера снова не
    // делала бы тест-задачу устаревшей — ровно та ловушка, что описана выше.
    inputs.dir('examples')
            .withPropertyName('exampleMods')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // `ModApiSurfaceTest` checks the REAL published artifact, not this build file and not the source
    // tree: the question it answers is "can a mod compile against something the game will refuse to
    // load", and only the jar that actually ships can answer it. So the jar has to exist first, and
    // a change to it has to make this task stale.
    //
    // The test FINDS the jar itself, by the same relative-path convention every other ratchet here
    // uses (`SourceCodeScanner`'s callers say `Path.of("src", "main", "java")`) — see `BuildOutputs`.
    // An earlier version injected the path as a `systemProperty` from this block instead, which made
    // the test unrunnable outside Gradle: green in the gate, and a bare failure for anyone who
    // launched it from an IDE. A ratchet nobody can run by hand is a ratchet people route around.
    dependsOn tasks.named('apiJar')
    inputs.file(tasks.named('apiJar', Jar).flatMap { it.archiveFile })
            .withPropertyName('apiJar')
            .withPathSensitivity(PathSensitivity.NONE)
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
    }
}

