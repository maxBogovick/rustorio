# Ускорение цикла проверки: агент и человек гоняют `./gradlew build` после каждой правки,
# поэтому всё, что срезает время между «поправил» и «увидел результат», окупается сразу.

# Конфигурационный кеш: результат фазы конфигурации переиспользуется, пока не менялись
# build-скрипты, свойства и окружение. Gradle сам предлагал его включить в выводе сборки.
org.gradle.configuration-cache=true

# Кеш сборки: выход задачи, уже посчитанный на этих же входах, берётся из кеша, а не считается
# заново. Здесь это в первую очередь про переключение веток и `clean` — обычный инкрементальный
# прогон и без него не пересчитывает то, что не менялось.
org.gradle.caching=true

# `org.gradle.parallel` СОЗНАТЕЛЬНО не включён: он распараллеливает задачи РАЗНЫХ проектов, а
# проект здесь один. Смысл появится, когда движок разъедется на модули (rustorio-api отдельным
# артефактом) — тогда и включать, вместе с замером, а не «на всякий случай».

